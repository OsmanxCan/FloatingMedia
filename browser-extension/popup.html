<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>FloatingMedia</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1c22;
      --muted: #6b7180;
      --line: #e3e5ea;
      --hover: #f2f4f8;
      --accent: #3b74e6;
      --ok: #0a7a32;
      --err: #b00020;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1d23;
        --fg: #eceef2;
        --muted: #9aa0ad;
        --line: #2d3039;
        --hover: #262932;
        --accent: #6b9bff;
        --ok: #5fd08a;
        --err: #ff7b8a;
      }
    }
    * { box-sizing: border-box; }
    body {
      font: 13px/1.4 system-ui, sans-serif;
      margin: 0;
      width: 360px;
      background: var(--bg);
      color: var(--fg);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--line);
    }
    header strong { font-size: 14px; }
    .tabs { display: flex; gap: 4px; }
    .tabs button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 12px;
      cursor: pointer;
    }
    .tabs button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    #list {
      max-height: 340px;
      overflow-y: auto;
      padding: 4px 0;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 6px 12px;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .item:hover { background: var(--hover); }
    .thumb {
      flex: none;
      width: 72px;
      height: 44px;
      border-radius: 6px;
      background: var(--line) center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 18px;
      overflow: hidden;
    }
    .meta { min-width: 0; flex: 1; }
    .meta .title { font-weight: 600; }
    .meta .url {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty {
      padding: 18px 12px;
      color: var(--muted);
      text-align: center;
    }
    .manual {
      border-top: 1px solid var(--line);
      padding: 10px 12px 12px;
    }
    .row { display: flex; gap: 6px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
    }
    .btn {
      padding: 6px 10px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    .btn.secondary {
      width: 100%;
      margin-top: 6px;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--line);
    }
    #status { margin-top: 8px; font-size: 12px; min-height: 16px; }
    .pipbox { padding: 12px 12px 10px; border-bottom: 1px solid var(--line); }
    .btn.pip { width: 100%; padding: 9px 10px; font-weight: 600; font-size: 13px; }
    .hint { margin-top: 6px; color: var(--muted); font-size: 11px; text-align: center; }
    .err { color: var(--err); }
    .ok { color: var(--ok); }
  </style>
</head>
<body>
  <div class="pipbox">
    <button id="pip" class="btn pip">⧉ Videoyu yüzen pencereye al</button>
    <div class="hint">Her sitede çalışır · Kısayol: Alt+P · Pencere her zaman üstte kalır</div>
  </div>

  <header>
    <strong>Uygulamada aç</strong>
    <div class="tabs">
      <button data-filter="all" class="active">Tümü</button>
      <button data-filter="video">Video</button>
      <button data-filter="image">Fotoğraf</button>
    </div>
  </header>

  <div id="list"><div class="empty">Sayfa taranıyor…</div></div>

  <div class="manual">
    <div class="row">
      <input id="url" type="url" placeholder="Video / fotoğraf / sayfa adresi" />
      <button id="send" class="btn">Gönder</button>
    </div>
    <button id="page" class="btn secondary">Bu sayfanın videosunu aç</button>
    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
