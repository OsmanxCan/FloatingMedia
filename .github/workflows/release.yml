name: Release

# v ile başlayan bir etiket gönderildiğinde (ör. v0.1.0) uygulamayı derler
# ve GitHub Releases sayfasına yükler. Actions sekmesinden elle de
# çalıştırılabilir (o zaman yalnızca "Artifacts" olarak yüklenir).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch:
    name: Arch / CachyOS paketi
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Bağımlılıklar
        run: |
          pacman -Syu --noconfirm --needed git cmake ninja qt6-base qt6-declarative qt6-multimedia qt6-tools

      - uses: actions/checkout@v4

      - name: Paketi derle
        run: |
          ./packaging/make-source-tarball.sh
          useradd -m builder
          chown -R builder:builder .
          su builder -c "cd packaging/arch && makepkg --noconfirm --nodeps"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: packaging/arch/*.pkg.tar.zst

  appimage:
    name: AppImage (tüm dağıtımlar)
    runs-on: ubuntu-22.04
    continue-on-error: true
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4

      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build file libgl1-mesa-dev libegl1 \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libpulse0 libva2 libvdpau1

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia'
          cache: true

      - name: Derle
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DFLOATINGMEDIA_BUILD_TESTS=OFF \
            -DFLOATINGMEDIA_INSTALL_KWIN_SCRIPT=OFF
          cmake --build build
          DESTDIR="$PWD/AppDir" cmake --install build --component Runtime

      - name: AppImage oluştur
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}"
          export QML_SOURCES_PATHS="$GITHUB_WORKSPACE"
          export EXTRA_PLATFORM_PLUGINS="libqwayland-generic.so;libqwayland-egl.so"
          export LINUXDEPLOY_OUTPUT_VERSION="${GITHUB_REF_NAME#v}"

          # Video (FFmpeg) ve Wayland eklentilerini garanti altına al
          EXTRA_ARGS=()
          for d in multimedia wayland-shell-integration wayland-graphics-integration-client wayland-decoration-client; do
            if [ -d "$QT_ROOT_DIR/plugins/$d" ]; then
              mkdir -p "AppDir/usr/plugins/$d"
              cp -a "$QT_ROOT_DIR/plugins/$d/." "AppDir/usr/plugins/$d/"
              for f in AppDir/usr/plugins/$d/*.so; do EXTRA_ARGS+=(--deploy-deps-only "$f"); done
            fi
          done

          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/floatingmedia.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/floatingmedia.svg \
            "${EXTRA_ARGS[@]}" \
            --plugin qt --output appimage
          ls -la *.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: FloatingMedia-*.AppImage

  release:
    name: GitHub Release
    needs: [arch, appimage]
    if: ${{ !cancelled() && needs.arch.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Tarayıcı eklentisi zip
        run: |
          cd browser-extension
          zip -r "../dist/floatingmedia-browser-extension-${GITHUB_REF_NAME}.zip" . -x 'native-messaging/*'

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
